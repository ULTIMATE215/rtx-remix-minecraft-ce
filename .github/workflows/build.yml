name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Java target
        id: props
        shell: pwsh
        run: |
          $java = Select-String -Path gradle.properties -Pattern '^release_java_version=(\d+)$'
          if (-not $java) { throw 'gradle.properties has no release_java_version' }
          "java=$($java.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}
      # The pinned runtime comes from public Packman; no credentials are used.
      - name: Build and test
        run: '& "$env:GITHUB_WORKSPACE\gradlew.bat" build test -Parch=win64'
      - name: Upload installable JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rtx-remix-minecraft-win64-jar
          path: build/libs/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  legacy-interop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "8"
      - name: Compile and test legacy OpenGL bridge
        shell: powershell
        run: '& "$env:GITHUB_WORKSPACE\forge-1.12.2\scripts\build-bridge.ps1" -JdkPath $env:JAVA_HOME'

  forge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "8"
      - name: Build and test Forge 1.12.2
        working-directory: forge-1.12.2
        run: '.\gradlew.bat build test diagnosticJar'
