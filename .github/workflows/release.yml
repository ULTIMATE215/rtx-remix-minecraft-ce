# Publishes one GitHub Release per tag. Tags are v<mod_version>+mc<minecraft_version>,
# cut from the main branch (latest Minecraft) or an mc/<version> branch.
name: release

on:
  push:
    # A + in a filter pattern is a quantifier, so match broadly here and
    # select release tags in the job's if.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.inputs.tag || github.ref_name, '+mc')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Read target versions
        id: props
        shell: pwsh
        run: |
          $props = @{}
          Get-Content gradle.properties | Where-Object { $_ -match '^\s*([\w.]+)\s*=\s*(.*)$' } |
            ForEach-Object { $props[$Matches[1]] = $Matches[2].Trim() }
          $expected = "v$($props.mod_version)+mc$($props.minecraft_version)"
          if ($env:TAG -ne $expected) { throw "Tag $env:TAG does not match gradle.properties ($expected)" }
          "mc=$($props.minecraft_version)" >> $env:GITHUB_OUTPUT
          "mod=$($props.mod_version)" >> $env:GITHUB_OUTPUT
          "java=$($props.release_java_version)" >> $env:GITHUB_OUTPUT
          "loader=$($props.fabric_loader_version)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      # The pinned runtime comes from public Packman; no credentials are used.
      - name: Build and test
        run: '& "$env:GITHUB_WORKSPACE\gradlew.bat" build test -Prelease -Parch=win64'

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ steps.props.outputs.mc }}
          MOD: ${{ steps.props.outputs.mod }}
          MC_JAVA: ${{ steps.props.outputs.java }}
          FABRIC_LOADER: ${{ steps.props.outputs.loader }}
        run: |
          $jar = Get-Item "build/libs/rtx-remix-renderer-$($env:MOD)+mc$($env:MC)-win64.jar" -ErrorAction Stop
          $hash = (Get-FileHash $jar.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($jar.Name)" | Out-File -Encoding ascii "$($jar.FullName).sha256"
          $notes = @"
          RTX Remix for Minecraft Community Edition (Unofficial) $env:MOD for **Minecraft $env:MC** (Fabric, Windows x64).

          ### Install
          1. Create a Minecraft $env:MC instance with Java $env:MC_JAVA and Fabric Loader $env:FABRIC_LOADER or newer.
          2. Download ``$($jar.Name)`` and copy it into the instance's ``mods`` folder.
          3. Launch the Fabric instance. Fabric API, the RTX Remix runtime, and required resources are bundled; the first launch unpacks the native files.

          Requires a GeForce RTX GPU. Not affiliated with or endorsed by NVIDIA, Mojang, or Microsoft.

          SHA-256: ``$hash``
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'rtx-remix-release-notes.md'
          [System.IO.File]::WriteAllText($notesPath, $notes)
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $jar.FullName "$($jar.FullName).sha256" --clobber
          } else {
            gh release create $env:TAG $jar.FullName "$($jar.FullName).sha256" `
              --title "$env:MOD for Minecraft $env:MC" --notes-file $notesPath
          }
